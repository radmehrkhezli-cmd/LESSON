<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزوه مطالعات اجتماعی نهم – آقای پناهی</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--c:#fff;--t:#14202e;--m:#5b6b7d;--a:#0f766e;--l:#d9e0ea;--ok:#15803d;--no:#b91c1c;--gd:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050a14;--c:#0c1626;--t:#e6f1ff;--m:#8fa6c4;--a:#22d3ee;--l:#1c3350;--ok:#4ade80;--no:#f87171;--gd:#fbbf24}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) linear-gradient(var(--l) 1px,transparent 1px) 0 0/28px 28px;background-image:linear-gradient(color-mix(in srgb,var(--l) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--l) 55%,transparent) 1px,transparent 1px);background-size:28px 28px;color:var(--t);font:15px/2 Vazirmatn,Tahoma,sans-serif}
header{padding:26px 16px 20px;text-align:center;border-bottom:2px solid var(--a);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--a) 22%,var(--c)));box-shadow:0 6px 30px color-mix(in srgb,var(--a) 30%,transparent)}h1{text-shadow:0 0 14px color-mix(in srgb,var(--a) 70%,transparent)}
h1{margin:0;font-size:22px}header p{margin:0;color:var(--m);font-size:13px}
header b{color:var(--a)}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px;max-width:820px;margin:auto}
nav button{flex:none;border:1px solid var(--l);background:var(--c);border-radius:10px;padding:2px 14px;font:inherit;color:var(--t)}
nav button.on{background:var(--a);color:#fff;border-color:var(--a)}
main{max-width:820px;margin:auto;padding:4px 12px 30px}
.card{background:color-mix(in srgb,var(--c) 92%,transparent);border:1px solid var(--l);border-right:4px solid var(--a);border-radius:14px;padding:12px 16px;margin:12px 0;box-shadow:0 0 18px color-mix(in srgb,var(--a) 12%,transparent)}.card svg{width:100%;max-height:170px}
.card h3{margin:0;color:var(--a);font-size:16px}.card p{margin:2px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:8px;margin:10px 0;font:inherit;font-weight:700;background:var(--a);color:#fff}
.btn.g{background:var(--c);color:var(--t);border:1px solid var(--l)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
#tm{color:var(--gd);font-variant-numeric:tabular-nums}
.op{display:block;width:100%;text-align:right;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:4px 12px;margin:6px 0;font:inherit}
.op.s{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--c))}
.map{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.map i{width:30px;height:30px;line-height:28px;text-align:center;border:1px solid var(--l);border-radius:8px;font-style:normal;font-size:13px}
.map i.d{background:var(--a);color:#fff}.map i.c{outline:2px solid var(--gd)}
.big{font-size:44px;font-weight:800;text-align:center;color:var(--a);margin:0}
.bar{height:8px;background:var(--l);border-radius:5px;overflow:hidden}.bar u{display:block;height:100%;background:var(--ok)}
.ok{color:var(--ok)}.no{color:var(--no)}.r{display:flex;gap:8px}.r>*{flex:1}
:root[data-theme=dark]{--bg:#050a14;--c:#0c1626;--t:#e6f1ff;--m:#8fa6c4;--a:#22d3ee;--l:#1c3350}
header{position:relative}.th{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;width:38px;height:38px;border-radius:12px;border:1px solid var(--l);background:var(--c);color:var(--t);font-size:18px}
#pg{position:fixed;top:0;right:0;height:3px;width:0;z-index:20;background:linear-gradient(90deg,#22d3ee,#f0abfc,#8b5cf6);box-shadow:0 0 10px #22d3ee}
#up{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:16px;width:44px;height:44px;border-radius:14px;border:0;background:var(--a);color:#02121a;font-size:20px;font-weight:800;opacity:0;transition:.25s;z-index:15;box-shadow:0 0 18px color-mix(in srgb,var(--a) 60%,transparent)}
.op{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:10px 0;border-radius:16px;border:1.5px solid var(--l);background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--a) 7%,var(--c)));transition:.18s;cursor:pointer;line-height:1.8}
.op b{flex:none;min-width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a);font-size:13px;font-weight:800;transition:.18s}
.op:hover{transform:translateX(-5px);border-color:var(--a);box-shadow:0 0 18px color-mix(in srgb,var(--a) 35%,transparent)}
.op:active{transform:scale(.98)}
.op.s{border-color:var(--a);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 24%,var(--c)),var(--c));box-shadow:0 0 24px color-mix(in srgb,var(--a) 50%,transparent)}
.op.s b{background:var(--a);color:#02121a;transform:scale(1.12) rotate(-4deg)}
.op.s::after{content:"✓";margin-right:auto;color:var(--a);font-size:20px;font-weight:800}
.tb{height:7px;border-radius:5px;background:var(--l);overflow:hidden;margin:8px 0}.tb u{display:block;height:100%;background:linear-gradient(90deg,var(--a),#f0abfc);transition:width 1s linear}
.map i{cursor:pointer;transition:.15s}.map i.f{background:#f59e0b;border-color:#f59e0b;color:#000}.map i:hover{transform:scale(1.12)}
.card b{font-size:17px}.btn:hover{filter:brightness(1.12)}
footer{text-align:center;padding:18px;color:var(--m);font-size:13px;border-top:1px solid var(--l)}footer b{color:var(--a)}
body{background-image:radial-gradient(800px 500px at 85% -5%,rgba(139,92,246,.28),transparent),radial-gradient(700px 500px at 0 100%,rgba(34,211,238,.16),transparent),linear-gradient(rgba(34,211,238,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.06) 1px,transparent 1px);background-size:auto,auto,34px 34px,34px 34px;background-attachment:fixed}
h1{background:linear-gradient(90deg,#22d3ee,#f0abfc,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:clamp(28px,7vw,44px)}header p{color:var(--a);font-weight:700}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 85%,transparent)}
h2{color:var(--a);text-shadow:0 0 12px color-mix(in srgb,var(--a) 50%,transparent);margin:22px 0 4px}
.pn{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:6px 16px;box-shadow:0 0 22px color-mix(in srgb,var(--a) 14%,transparent)}
.pn h4{margin:12px 0 0;color:#f0abfc}.pn p{margin:6px 0}
.tip,.key{border-right:4px solid #f0abfc;background:rgba(240,171,252,.09);border-radius:10px;padding:6px 14px;margin:10px 0}.key{border-color:var(--a);background:rgba(34,211,238,.09)}
.pn table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}.pn th,.pn td{border:1px solid var(--l);padding:3px 6px;text-align:center}.pn th{background:rgba(139,92,246,.25)}.pn svg{width:100%;max-height:190px}
</style></head><body>
<header><button class="th" aria-label="تغییر تم تاریک و روشن" onclick="tg()">◐</button><p>مطالعات اجتماعی پایهٔ نهم · درس ۱ تا ۱۲</p><h1>جزوهٔ <b>آقای پناهی</b></h1></header>
<i id="pg"></i><button id="up" aria-label="بازگشت به بالا" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button><nav id="nv"></nav><main id="m"></main>
<footer>آقای پناهی با کمک <b>خزلی</b></footer>
<script>
/* هر سؤال: [متن، [گزینهٔ درست، غلط۱، غلط۲، غلط۳]، توضیح] */
var L=[
{t:"۱ زمین، مهد انسان‌ها",s:["منظومهٔ خورشیدی = خورشید + ۸ سیاره. چهار سیارهٔ درونی (تیر، ناهید، زمین، بهرام) سطح جامد دارند؛ چهار سیارهٔ بیرونی (برجیس، کیوان، اورانوس، نپتون) گازی‌اند.","زمین سومین سیاره از خورشید است و عمر آن حدود ۴/۵ میلیارد سال برآورد می‌شود.","خورشید یکی از بیش از ۲۰۰ میلیارد ستارهٔ کهکشان راه شیری است؛ مساحت زمین ۵۱۰ میلیون کیلومتر مربع است.","موقعیت مکانی هر پدیده را با مدارها (موازی استوا) و نصف‌النهارها (مبدأ: گرینویچ) مشخص می‌کنند."],
q:[["زمین چندمین سیاره از خورشید است؟",["سوم","دوم","چهارم","پنجم"],"زمین پس از تیر و ناهید، سومین سیاره است."],["سیاره‌های بیرونی منظومهٔ خورشیدی از چه ساخته شده‌اند؟",["گازها","سنگ و خاک جامد","فقط یخ","فلز"],"چهار سیارهٔ دور گازی‌اند؛ سطح جامد از ویژگی سیاره‌های درونی است."],["مبدأ نصف‌النهارها کدام است؟",["گرینویچ","استوا","رأس‌السرطان","قطب شمال"],"استوا مبدأ مدارهاست، گرینویچ مبدأ نصف‌النهارها."]]},
{t:"۲ حرکات زمین",s:["حرکت وضعی: چرخش زمین به دور خود در ۲۴ ساعت، از غرب به شرق ← پیدایش شب و روز و اختلاف ساعت. حرکت خورشید در آسمان «ظاهری» است.","هر منطقهٔ زمانی ۱۵ درجه است (۳۶۰÷۲۴) و کشورهای شرق گرینویچ زودتر ظهر می‌شوند.","ساعت رسمی برای جلوگیری از آشفتگی در حمل‌ونقل و کارها ساخته شد؛ ایران با گستردگی بیش از یک منطقه، یک ساعت رسمی دارد.","حرکت انتقالی (دور خورشید، حدود یک سال) همراه با کج بودن محور (۲۳/۵ درجه) علت پیدایش فصل‌هاست."],
q:[["علت پیدایش شب و روز چیست؟",["حرکت وضعی زمین","حرکت انتقالی زمین","حرکت خورشید","گردش ماه"],"چرخش زمین به دور خود، نقاط مختلف را پیاپی مقابل خورشید می‌آورد."],["پهنای هر منطقهٔ زمانی چند درجه است؟",["۱۵","۲۴","۳۰","۶۰"],"۳۶۰ درجه تقسیم بر ۲۴ ساعت = ۱۵ درجه."],["پیدایش فصل‌ها نتیجهٔ کدام است؟",["حرکت انتقالی و کج بودن محور","فقط حرکت وضعی","فاصلهٔ زمین از ماه","باد و بارش"],"بدون کجی محور، با وجود حرکت انتقالی فصل‌ها پدید نمی‌آمدند."]]},
{t:"۳ چهرهٔ زمین",s:["چهار محیط: سنگ‌کره، آب‌کره، هواکره (۷۸٪ نیتروژن و ۲۱٪ اکسیژن) و زیست‌کره.","حدود ۷۱٪ سطح زمین را آب پوشانده است؛ آب نیمکرهٔ جنوبی (۸۲٪) بیشتر از شمالی (۶۰٪) است.","رنگ سبز نقشه: جلگه و دشت (پست)؛ زرد و قهوه‌ای: فلات و کوه. تبت بلندترین فلات، اورست بلندترین قله و گودال ماریانا ژرف‌ترین نقطه است.","عوامل درونی (حرکت ورقه‌ها: چین‌خوردگی، گسل، زلزله، آتشفشان) و بیرونی (فرسایش) ناهمواری‌ها را می‌سازند. کوه جوان بلند: دره V، قله تیز؛ کوه کم‌ارتفاع: دره U و قلهٔ گنبدی."],
q:[["حدود چند درصد سطح زمین را آب پوشانده است؟",["۷۱","۳۰","۵۰","۹۰"],"وسعت آب‌ها بیشتر از خشکی‌هاست."],["دره‌های V شکل و تنگ نشانهٔ کدام ناهمواری‌اند؟",["کوه‌های بلند و جوان","کوه‌های فرسوده","جلگه‌ها","دشت‌ها"],"کوه‌های جوان شیب تند و دره‌های تنگ دارند."],["بلندترین فلات جهان کدام است؟",["تبت","آند","راکی","سیبری"],"فلات تبت و کوه‌های هیمالیا."]]},
{t:"۴ آب فراوان، هوای پاک",s:["پنج اقیانوس: آرام (پهناورترین و عمیق‌ترین)، اطلس، هند، منجمد شمالی و منجمد جنوبی.","فلات قاره: ناحیهٔ کم‌عمق (کمتر از ۲۰۰ متر) کنار خشکی؛ پرمنبع از نفت، گاز و ماهی. پس از آن شیب قاره ناگهان زیاد می‌شود.","محل برخورد جریان گرم و سرد، بهترین مناطق صید ماهی است (نیوفوندلند و شرق ژاپن).","تهدیدها: ریختن زباله و پلاستیک، دفن پسماند اتمی، صید بی‌رویه."],
q:[["پهناورترین و عمیق‌ترین اقیانوس جهان کدام است؟",["آرام","اطلس","هند","منجمد شمالی"],"عمیق‌ترین نقطهٔ آب‌ها در اقیانوس آرام است."],["چرا محل تلاقی جریان‌های گرم و سرد برای ماهیگیری مهم است؟",["صید ماهی در آنجا پررونق است","آب شیرین است","یخ‌زده است","فلات قاره ندارد"],"نیوفوندلند و شرق ژاپن نمونه‌اند."],["فلات قاره چه عمقی دارد؟",["کمتر از ۲۰۰ متر","حدود ۴۰۰۰ متر","بیش از ۶۰۰۰ متر","۱۰۰۰۰ متر"],"قسمت کم‌عمق کنار ساحل است."]]},
{t:"۵ زیست‌بوم‌های جهان",s:["زیست‌بوم (بیوم): ناحیهٔ وسیعی که گیاهان و جانوران خاصی دارد و از چند بوم‌سازگان تشکیل شده است.","مهم‌ترین عامل پراکندگی: آب‌وهوا، به‌ویژه دما و بارش.","هشت زیست‌بوم: توندرا، تایگا، جنگل پهن‌برگ معتدل، علفزار معتدل، مدیترانه‌ای، بیابان، جنگل بارانی استوایی و ساوان.","توندرا: سرد، خزه و گل‌سنگ، خرس قطبی. تایگا: جنگل مخروطیان و سوزنی‌برگ (کاج، سرو)؛ جنگل‌های کانادا."],
q:[["مهم‌ترین عامل در پیدایش زیست‌بوم‌ها کدام است؟",["آب‌وهوا","جنس خاک","ارتفاع","جمعیت"],"از میان عناصر آب‌وهوا، دما و بارش بیشترین تأثیر را دارند."],["زیست‌بوم دارای کاج و سرو (مخروطیان) کدام است؟",["تایگا","توندرا","ساوان","بیابان"],"تایگا زیر توندرا گسترده است."],["گیاهان توندرا کدام‌اند؟",["خزه و گل‌سنگ","کاج","نخل","موز"],"سرمای شدید فقط اجازهٔ رویش این‌ها را می‌دهد."]]},
{t:"۶ زیست‌بوم‌ها در خطرند",s:["انقراض: مرگ آخرین عضو یک گونه. در دو قرن اخیر شمار انقراض‌ها بسیار بیشتر شده است.","علل تخریب زیستگاه: گسترش بی‌برنامهٔ شهر، جاده و سد، فعالیت صنعتی، مصرف‌گرایی و زباله، شکار و صید بی‌رویه.","جنگل‌های بارانی استوایی «ریه‌های زمین»‌اند: غنی‌ترین تنوع زیستی، جذب دی‌اکسید کربن و تولید اکسیژن.","جنگل‌زدایی در برزیل و اندونزی (آمازون) به‌سبب کشاورزی، دامداری، الوار و معدن گسترش یافته است."],
q:[["به نابودی کامل جنگل‌ها چه می‌گویند؟",["جنگل‌زدایی","جنگل‌کاری","فرسایش","بیابان‌زایی"],"مثال آمازون."],["چرا جنگل‌های استوایی «ریه‌های زمین» نام دارند؟",["اکسیژن می‌سازند و دی‌اکسید کربن جذب می‌کنند","دما را بالا می‌برند","خاک را شور می‌کنند","باران را قطع می‌کنند"],"نقش مهم در آب و اکسیژن کره زمین."],["کدام مورد علت تخریب زیستگاه نیست؟",["حفاظت از گونه‌ها","شکار بی‌رویه","مصرف‌گرایی","ساخت سد بدون برنامه"],"حفاظت راه‌حل است نه علت."]]},
{t:"۷ جمعیت جهان",s:["جمعیت جهان در ۲۰۲۲ از ۸ میلیارد گذشت و پیش‌بینی می‌شود در ۲۰۵۰ به حدود ۱۱ میلیارد برسد.","علت رشد دو قرن اخیر: کاهش مرگ‌ومیر به‌دلیل بهبود بهداشت (مهار بیماری‌های واگیر) و بهبود تغذیه (کشاورزی صنعتی و حمل‌ونقل).","رشد طبیعی = تفاوت موالید و مرگ‌ومیر: موالید > مرگ ← افزایش؛ برابر ← ثابت؛ کمتر ← کاهش (رشد منفی).","رشد منفی یعنی سالخورده شدن جامعه و کمبود نیروی جوان؛ برخی کشورها فرزندآوری را تشویق می‌کنند. رشد درصدی = (موالید − مرگ) ÷ ۱۰."],
q:[["دو عامل اصلی کاهش مرگ‌ومیر در دو قرن اخیر چیست؟",["بهبود بهداشت و تغذیه","جنگ و قحطی","شهرنشینی و صنعت","مهاجرت و تجارت"],"پزشکی و کشاورزی صنعتی."],["اگر موالید ۳۰ و مرگ‌ومیر ۹ در هزار باشد، رشد طبیعی چند درصد است؟",["۲/۱","۳۹","۲۱","۰/۲۱"],"۲۱ در هزار = ۲/۱ درصد."],["رشد منفی در یک کشور چه پیامدی دارد؟",["سالخورده شدن جمعیت","جوان‌تر شدن جمعیت","افزایش موالید","بی‌تأثیر است"],"کمبود جوان و نیروی کار."]]},
{t:"۸ بی‌عدالتی و نابرابری",s:["نابرابری جهانی: تفاوت کشورها در ثروت، آموزش، بهداشت، مسکن و کیفیت زندگی.","عوامل خارجی: استعمار و غارت کشورها توسط قدرت‌های سلطه‌گر (انگلستان، فرانسه، آمریکا…)، اشغال، دخالت و جلوگیری از استقلال.","عوامل داخلی: وابستگی حکومت به بیگانگان، استبداد، فرهنگ غلط (تنبلی)، مدیریت ضعیف، غفلت از استعدادها و نبود وحدت.","شاخص توسعهٔ انسانی: درآمد و رفاه + امید به زندگی + سواد و آموزش. کشورها در چهار گروه‌اند و ایران در گروه «توسعهٔ انسانی بالا» است."],
q:[["کدام سه معیار شاخص توسعهٔ انسانی را می‌سازند؟",["درآمد، امید به زندگی، آموزش","مساحت، جمعیت، نفت","تجارت، صنعت، کشاورزی","ارتش، مرز، قانون"],"بنابراین فقط اقتصاد ملاک نیست."],["استعمار جزو کدام دسته از عوامل نابرابری است؟",["خارجی","داخلی","طبیعی","جمعیتی"],"غارت منابع توسط کشورهای سلطه‌گر."],["ایران از نظر شاخص توسعهٔ انسانی در کدام گروه است؟",["بالا","پایین","متوسط","خیلی پایین"],"نمودار ۲۰ سالهٔ ایران صعودی است."]]},
{t:"۹ ایرانی متحد و یکپارچه",s:["پیش از صفویه ایران تجزیه شده بود؛ همسایگان طمع‌کار: عثمانی (غرب) و ازبکان (شمال‌شرق).","شیخ صفی‌الدین اردبیلی (شیعه) خانقاهی در اردبیل داشت؛ ایل‌های ترک شیعه، «قزلباش»، یاران خاندان او شدند.","شاه اسماعیل صفوی با قزلباش‌ها در تبریز تاج‌گذاری کرد، مذهب شیعه را رسمی کرد، رقیبان را از میان برداشت و ازبکان را شکست داد.","نتیجه: ایرانی یکپارچه و مستقل با قلمروی نزدیک به ساسانیان؛ عثمانی‌ها ایران را تهدید می‌کردند و جنگ چالدران رخ داد."],
q:[["قزلباش‌ها چه کسانی بودند؟",["ایل‌های ترک شیعه، طرفداران صفویان","سپاه عثمانی","قبایل ازبک","بازرگانان"],"پشتوانهٔ نظامی شاه اسماعیل."],["شاه اسماعیل نخستین بار در کدام شهر تاج‌گذاری کرد؟",["تبریز","اصفهان","قزوین","شیراز"],"سپس مذهب شیعه را رسمی اعلام کرد."],["دو دشمن اصلی صفویان که بودند؟",["عثمانی و ازبک","روس و انگلیس","افغان و مغول","ترک و یونان"],"عثمانی در غرب، ازبک در شرق."]]},
{t:"۱۰ ایران در عصر صفوی",s:["جمعیت حدود ۱۰ میلیون نفر؛ روستاییان و کوچ‌نشینان بیشترین جمعیت را داشتند و ۱۰ تا ۱۵ درصد در شهرها زندگی می‌کردند.","درآمد اصلی حکومت: مالیات کشاورزان و دامداران.","صنایع شکوفا: ابریشم، پارچه‌های مخمل و زربفت، قالی؛ کاشان و اصفهان مراکز مهم. بخشی از محصولات صادر می‌شد.","امنیت و نظم ← رونق تجارت داخلی و خارجی؛ شاه عباس اول شبکه راه‌ها و کاروانسراها را گسترد."],
q:[["بیشترین ساکنان ایران صفوی که بودند؟",["روستاییان و کوچ‌نشینان","شهرنشینان","بازرگانان","نظامیان"],"فقط ۱۰ تا ۱۵ درصد شهرنشین بودند."],["منبع اصلی درآمد حکومت صفوی چه بود؟",["مالیات کشاورزان و دامداران","نفت","غنایم جنگی","گمرک دریایی"],"نتیجهٔ قدرت مرکزی و امنیت."],["رونق تجارت صفوی مرهون چه بود؟",["امنیت و یکپارچگی کشور","جنگ","نفت","بی‌نظمی"],"راه‌ها و کاروانسراها گسترش یافت."]]},
{t:"۱۱ حفظ استقلال و اتحاد",s:["پس از افغان‌ها ایران گرفتار تجزیه شد؛ روسیه و عثمانی بخش‌هایی را اشغال کردند.","نادر افشار افغان‌ها و بیگانگان را بیرون راند، شاه شد (افشاریه)، به هند تا دهلی لشکر کشید و برای نیروی دریایی خلیج فارس کوشید. در پایان بدبین و خشن شد و کشته شد.","کریم‌خان زند (زندیه): لقب «وکیل‌الرعایا»، پایتخت شیراز، حدود ۳۰ سال آرامش نسبی؛ بازار و مسجد وکیل از آثار اوست.","همزمان انگلیس بر هند مسلط شد و نفوذ تجاری آن در ایران بیشتر شد. پس از مرگ کریم‌خان، آقامحمدخان قاجار قدرت گرفت."],
q:[["کریم‌خان زند چه لقبی برگزید؟",["وکیل‌الرعایا","شاه","خان خانان","امیرالمؤمنین"],"یعنی نمایندهٔ مردم."],["پایتخت زندیه کجا بود؟",["شیراز","اصفهان","تهران","تبریز"],"بازار و مسجد وکیل در آن ساخته شد."],["نادر پس از چه چیزی شاه شد؟",["بیرون راندن افغان‌ها، روس‌ها و عثمانی‌ها","جنگ با هند","مرگ کریم‌خان","شکست ازبکان"],"سپس سلسلهٔ افشاریه را بنیان گذاشت."]]},
{t:"۱۲ پیشرفت و رهایی از سلطه",s:["شکست‌های ایران از روسیه و انگلیس در دورهٔ قاجار نشان داد که علم و صنعت اروپا برتری دارد.","عباس‌میرزا (ولیعهد فتحعلی‌شاه): فرستادن دانشجو به انگلستان، ترجمهٔ کتاب‌های اروپایی، ورود صنعت چاپ و نوسازی ارتش.","امیرکبیر (صدراعظم ناصرالدین‌شاه): برقراری امنیت، مبارزه با فساد اداری، نوسازی ساختار حکومت، استقلال در سیاست خارجی.","هر دو دریافتند که فقط کثرت سپاه و شجاعت کافی نیست؛ دانش و فناوری لازم است."],
q:[["عباس‌میرزا چه اقدامی برای نوسازی کرد؟",["اعزام دانشجو به اروپا","بستن مرزها","حذف ارتش","واگذاری امتیاز"],"او قدرت روسیه را مدیون علم و تجهیزات می‌دانست."],["امیرکبیر در دورهٔ کدام شاه صدراعظم بود؟",["ناصرالدین‌شاه","فتحعلی‌شاه","نادرشاه","شاه عباس"],"در آغاز سلطنت او."],["درس اصلی شکست‌های نظامی قاجار چه بود؟",["لزوم علم و فناوری","لزوم افزایش مالیات","کم بودن سرباز","فرار از جنگ"],"شجاعت به‌تنهایی کافی نیست."]]}];
var m=document.getElementById("m"),nv=document.getElementById("nv"),c=0,X=null,iv;
function sh(a){a=a.slice();for(var i=a.length;i>1;){var j=Math.random()*i|0,t=a[--i];a[i]=a[j];a[j]=t}return a}
function nav(){nv.innerHTML=L.map(function(d,i){return"<button class='"+(i==c&&!X?"on":"")+"' onclick='go("+i+")'>"+d.t.split(" ")[0]+"</button>"}).join("")+[1,2,3,4,5,6].map(function(n){return"<button onclick='st("+(99+n)+")'>آزمون فصل "+n+"</button>"}).join("")+"<button onclick='st(-1)'>🏆 آزمون جامع نهایی</button>"}
function go(i){clearInterval(iv);X=null;c=i;nav();var d=L[i];if(R[i]){m.innerHTML="<h2>"+d.t+"</h2>"+R[i].map(function(x){return"<h2 style='font-size:19px'>"+x[0]+"</h2><div class='pn'>"+x[1]+"</div>"}).join("")+"<button class='btn' onclick='st("+i+")'>شروع آزمون زمان‌دار این درس</button>";scrollTo(0,0);return}m.innerHTML="<h2>"+d.t+"</h2>"+d.s.map(function(x,k){return"<div class='card'><h3>نکتهٔ "+(k+1)+"</h3><p>"+x+"</p></div>"}).join("")+(V[i]||"")+"<div class='card'><h3>🧠 مفهوم ساده + مثال</h3><p>"+M[i]+"</p></div><button class='btn' onclick='st("+i+")'>شروع آزمون زمان‌دار این درس</button>";scrollTo(0,0)}
function st(k){var p=[];L.forEach(function(d,i){if(k<0||k==i||(k>99&&i>>1==k-100))d.q.forEach(function(q){p.push({q:q[0],o:sh(q[1]),a:q[1][0],e:q[2],l:i})})});X={qs:sh(p).slice(0,k<0?20:10),i:0,ans:[],t:0,k:k};X.T=X.t=X.qs.length*40;X.fl=[];nav();clearInterval(iv);iv=setInterval(function(){X.t--;if(X.t<=0)fin();else tick()},1000);ex()}
function tick(){var e=document.getElementById("tm");if(e)e.textContent="⏱ "+Math.floor(X.t/60)+":"+("0"+X.t%60).slice(-2);var u=document.querySelector(".tb u");if(u)u.style.width=X.t/X.T*100+"%"}
function ex(){var q=X.qs[X.i];m.innerHTML="<div class='top'><span>سؤال "+(X.i+1)+" از "+X.qs.length+"</span><span id='tm'></span></div><div class='tb'><u style='width:"+X.t/X.T*100+"%'></u></div><div class='card'><small style='color:var(--m)'>پاسخ داده‌شده: "+X.ans.filter(function(a){return a!=null}).length+" از "+X.qs.length+"</small><br><b>"+q.q+"</b></div>"+q.o.map(function(o,j){return"<button class='op "+(X.ans[X.i]==o?"s":"")+"' onclick='pk("+j+")'><b>"+"الف ب ج د".split(" ")[j]+"</b><span>"+o+"</span></button>"}).join("")+"<button class='btn g' onclick='fg()'>"+(X.fl[X.i]?"🚩 برداشتن علامت":"🏳 علامت‌گذاری برای مرور")+"</button><div class='r'><button class='btn g' onclick='mv(-1)'>قبلی</button><button class='btn g' onclick='mv(1)'>بعدی</button></div><div class='map'>"+X.qs.map(function(_,i){return"<i class='"+(X.ans[i]!=null?"d ":"")+(X.fl[i]?"f ":"")+(i==X.i?"c":"")+"' onclick='X.i="+i+";ex()'>"+(i+1)+"</i>"}).join("")+"</div><p style='color:var(--m);font-size:13px'>هر پاسخ درست ۳+ ، هر پاسخ غلط ۱− ، بی‌پاسخ صفر</p><button class='btn' onclick='fin()'>پایان آزمون</button>";tick()}
function fg(){X.fl[X.i]=!X.fl[X.i];ex()}
function pk(j){var q=X.qs[X.i];X.ans[X.i]=X.ans[X.i]==q.o[j]?null:q.o[j];ex()}
function mv(d){X.i=Math.min(X.qs.length-1,Math.max(0,X.i+d));ex()}
function fin(){clearInterval(iv);var r=0,w=0,b=0,by={};X.qs.forEach(function(q,i){var a=X.ans[i];by[q.l]=by[q.l]||[0,0];by[q.l][1]++;if(a==null)b++;else if(a==q.a){r++;by[q.l][0]++}else w++});X.r=r;X.w=w;X.by=by;var s=r*3-w,p=Math.max(0,Math.round(s/(X.qs.length*3)*100));var ws=[],ss=[];for(var l in by)(by[l][0]==by[l][1]?ss:ws).push(L[l].t);
m.innerHTML="<div class='card'><p class='big'>"+p+"٪</p><p style='text-align:center'>نمره خام: "+s+" از "+X.qs.length*3+"<br><span class='ok'>درست "+r+"</span> · <span class='no'>غلط "+w+"</span> · بی‌پاسخ "+b+"</p></div>"+Object.keys(by).map(function(l){var v=by[l];return"<div class='card'>"+L[l].t+" <small>("+v[0]+" از "+v[1]+")</small><div class='bar'><u style='width:"+v[0]/v[1]*100+"%'></u></div></div>"}).join("")+"<div class='card'><p class='ok'>نقاط قوت: "+(ss.join("، ")||"—")+"</p><p class='no'>نقاط ضعف: "+(ws.join("، ")||"—")+"</p></div><button class='btn' onclick='key()'>مشاهده پاسخنامه</button><button class='btn g' onclick='st("+X.k+")'>آزمون مجدد (سؤالات جدید)</button>"}
function key(){m.innerHTML="<h2>پاسخنامه</h2>"+X.qs.map(function(q,i){var a=X.ans[i],g=a==q.a;return"<div class='card'><b>"+(i+1)+". "+q.q+"</b><p class='ok'>پاسخ درست: "+q.a+"</p>"+(g?"":"<p class='no'>پاسخ شما: "+(a||"بی‌پاسخ")+"</p>")+"<p style='color:var(--m)'>"+q.e+"</p></div>"}).join("")+"<button class='btn g' onclick='fin()'>بازگشت به نتیجه</button><button class='btn' onclick='st("+X.k+")'>آزمون مجدد</button>";scrollTo(0,0)}
var M=["خانهٔ شما آدرس دارد (شهر، خیابان، پلاک)؛ هر پدیدهٔ زمین هم آدرس دارد: عرض جغرافیایی (فاصله از استوا) و طول جغرافیایی (فاصله از گرینویچ). منظومه مثل یک خانواده است: خورشید در مرکز و سیاره‌ها دورش می‌گردند.","وقتی در قطار می‌نشینی درخت‌های کنار ریل به عقب می‌روند، در حالی که درخت جابه‌جا نمی‌شود؛ حرکت خورشید در آسمان هم همین‌گونه «ظاهری» است. ساعت رسمی قرارداد ملی است تا قطار و هواپیما هماهنگ باشند. فصل‌ها مثل کج گرفتن چراغ‌قوه روی توپ‌اند: جایی که نور مستقیم‌تر بتابد گرم‌تر است.","سنگ‌کره مثل پوستهٔ سیب، آب‌کره مثل آب‌میوهٔ آن و هواکره مثل بخار اطرافش است. درهٔ V تازه‌شکافته و تیز (جوان) است؛ درهٔ U مثل کاسه‌ای است که در زمان طولانی فرسوده شده. ورقه‌ها مثل کشتی‌هایی روی عسل غلیظ، چند سانتی‌متر در سال جابه‌جا می‌شوند.","اقیانوس‌ها ظرف مشترک همهٔ مردم‌اند؛ اگر هر کشوری زباله بریزد، همه آسیب می‌بینند. جایی که آب گرم و سرد به هم می‌رسند، مثل سر چهارراه شلوغ ماهی‌هاست؛ برای همین صیادان آنجا می‌روند.","آب‌وهوا مثل سازندهٔ منوی طبیعت است: دما و بارش مشخص می‌کنند چه گیاهی بروید و جانوران از همان گیاه تغذیه می‌کنند. توندرا چنان سرد است که فقط خزه می‌روید؛ استوا چنان گرم و پرباران است که جنگل انبوه می‌شود.","اگر آخرین ببر بمیرد، دیگر ببری متولد نمی‌شود؛ انقراض برگشت ندارد. جنگل بارانی مثل کارخانهٔ اکسیژن است و بریدن آن مثل خاموش کردن ریه‌های زمین.","اگر در یک ناحیه در هر هزار نفر ۲۵ تولد و ۱۰ مرگ باشد، رشد = ۲۵ − ۱۰ = ۱۵ در هزار = ۱/۵ درصد. مثل حساب بانکی: ورودی (موالید) منهای خروجی (مرگ‌ومیر) = تغییر موجودی.","دو دانش‌آموز با استعداد یکسان را تصور کن؛ یکی کتاب و مدرسه دارد و دیگری ندارد. نتیجه فرق می‌کند؛ نابرابری کشورها هم یعنی فرصت‌های نابرابر. استعمار مثل برداشتن سرمایهٔ دیگران است و وابستگی و تنبلی داخلی مثل باز گذاشتن در خانه.","ایرانِ پراکنده مثل خانهٔ بی‌نگهبان بود که همسایه‌ها (عثمانی و ازبک) چشم به آن داشتند. شاه اسماعیل با پشتوانهٔ قزلباش‌ها و مذهب مشترک تکه‌های کشور را مثل چسب به هم پیوند داد.","امنیت سرمایه است: وقتی جاده امن باشد بازرگان رفت‌وآمد می‌کند، کارگاه‌ها سفارش می‌گیرند و مالیات جمع می‌شود. کاشان برای ابریشم مثل پایتخت تولید بود.","نادر سردار پیروزی بود اما با بدگمانی و خشونت زمینهٔ قتل خود را فراهم کرد. کریم‌خان با فروتنی (وکیل‌الرعایا، نه شاه) توانست آرامش بسازد؛ ثمرهٔ آن رونق شیراز بود.","دانش‌آموزی که در مسابقه می‌بازد چون ابزار بهتری ندارد، راه‌حلش تعداد بیشتر تمرین‌کنندگان نیست؛ ابزار و آموزش بهتر است. عباس‌میرزا و امیرکبیر همین را فهمیدند: علم یعنی قدرت."];

[[0,"عرض جغرافیایی از کدام نقطه یا خط سنجیده می‌شود؟",["استوا","گرینویچ","قطب شمال","خورشید"],"عرض از استوا و طول از گرینویچ سنجیده می‌شود."],[1,"وقتی در گرینویچ ظهر است، وضعیت کشورهای شرق آن چگونه است؟",["از ظهر گذشته است","هنوز صبح است","نیمه‌شب است","دقیقاً ظهر است"],"شرق زودتر خورشید را می‌بیند."],[2,"کدام کوه شیب ملایم و قلهٔ گنبدی دارد؟",["کوه کم‌ارتفاع و فرسوده","کوه جوان و بلند","آتشفشان فعال","فلات"],"با فرسایش، قله‌ها گنبدی می‌شوند و دره‌ها U شکل."],[3,"چه عاملی کاوش اعماق اقیانوس‌ها را دشوار می‌کند؟",["فشار زیاد، تاریکی و دمای کم","گرمای بسیار","کم بودن آب","نبود ماهی"],"این دشواری‌ها مطالعهٔ علمی را سخت می‌کنند."],[4,"کدام زیست‌بوم پیچیده‌ترین و پرتنوع‌ترین است؟",["جنگل بارانی استوایی","توندرا","بیابان","تایگا"],"بیشترین تنوع گیاهی و جانوری جهان."],[5,"مهم‌ترین پیامد مرگ آخرین عضو یک گونه چیست؟",["انقراض همیشگی","مهاجرت گونه","کاهش موقت","تغییر رنگ"],"دیگر تولیدمثلی صورت نمی‌گیرد."],[6,"اگر موالید با مرگ‌ومیر برابر باشد جمعیت چه می‌شود؟",["ثابت می‌ماند","افزایش می‌یابد","صفر می‌شود","رشد منفی دارد"],"رشد طبیعی برابر صفر است."],[7,"دخالت و اشغال نظامی کشورها توسط قدرت‌های بزرگ جزو کدام عوامل نابرابری است؟",["خارجی","داخلی","طبیعی","جمعیتی"],"عامل خارجی نابرابری."],[8,"بنیان‌گذار حکومت صفوی کیست؟",["شاه اسماعیل","شاه عباس","نادر افشار","کریم‌خان"],"او پس از تسلط بر تبریز خود را شاه ایران خواند."],[9,"کاشان در عصر صفوی به چه صنعتی شهرت داشت؟",["ابریشم‌بافی و مخمل‌بافی","کشتی‌سازی","ذوب آهن","خودروسازی"],"گزارش شاردن آن را نشان می‌دهد."],[10,"نادرشاه در پایان چگونه از میان رفت؟",["فرماندهانش او را کشتند","در جنگ با هند کشته شد","طبیعی درگذشت","تبعید شد"],"بدگمانی و خشونتش فرماندهان را به قتل او واداشت."],[11,"چرا فقط شجاعت سپاهیان برای پیروزی کافی نبود؟",["دشمن علم و تجهیزات پیشرفته‌تر داشت","سرباز کم بود","هوا نامناسب بود","فرمانده نبود"],"این نتیجه‌گیری عباس‌میرزا بود."]].forEach(function(e){L[e[0]].q.push([e[1],e[2],e[3]])});

var R={0:[["۱) جایگاه زمین در جهان","<p>آسمان و زمین نشانه‌های قدرت خدایند. وقتی دربارهٔ شب و روز، استواری کوه‌ها، حرکت ابرها و آب‌های جاری فکر کنیم، به آفریدگاری مهربان و حکیم می‌رسیم. قرآن هم به <b>سفر در زمین و تفکر</b> دربارهٔ آن سفارش کرده است. انسان با فکر و دانش تجربی می‌تواند بخشی از رازهای زمین را کشف کند (راز غیب فقط با بیان خدا و معصومین دانسته می‌شود).</p><div class='key'><b>از بالا ببین:</b> فضانورد می‌گوید تا از فضا به زمین نگاه نکنی نمی‌فهمی سیارهٔ ما چقدر کوچک، زیبا و شکننده است. پس مراقبتش وظیفهٔ ماست.</div><h4>منظومهٔ خورشیدی</h4><p>منظومه یعنی یک ستاره + اجرامی که در مدار دورش می‌گردند. خورشید در مرکز است و سرچشمهٔ اصلی زندگی روی زمین.</p><table><tr><th>سیاره‌های درونی (سطح جامد)</th><th>سیاره‌های بیرونی (گازی)</th></tr><tr><td>۱ تیر ۲ ناهید ۳ زمین ۴ بهرام (مریخ)</td><td>۵ برجیس ۶ کیوان ۷ اورانوس ۸ نپتون</td></tr></table><div class='tip'><b>ترتیب را حفظ کن:</b> تیر، ناهید، زمین، بهرام | برجیس، کیوان، اورانوس، نپتون. زمین سوم است. عمر زمین و منظومه ≈ ۴/۵ میلیارد سال. برخی سیاره‌ها قمر دارند.</div><h4>کهکشان راه شیری</h4><p>خورشید یکی از ستارگان کهکشان راه شیری است. این کهکشان بیش از <b>۲۰۰ میلیارد ستاره</b> دارد؛ قطر هسته‌اش ۱۰ هزار سال نوری است و خورشید با سرعت ۲۲۰ km/s حدود <b>۲۵۰ میلیون سال</b> طول می‌کشد تا یک دور بزند. و راه شیری هم فقط یکی از هزاران کهکشان است! پس زمین بخش بسیار کوچکی از کیهان است (آیهٔ ۵۷ غافر: آفرینش آسمان‌ها و زمین بزرگ‌تر از آفرینش مردم است).</p><p><b>سال نوری</b> واحد فاصله است، نه زمان: مسافتی که نور (۳۰۰٬۰۰۰ km/s) در یک سال می‌پیماید.</p>"],["۲) مدارها: «عرض‌های» زمین","<p><b>استوا</b> بزرگ‌ترین دایرهٔ فرضی است که به فاصلهٔ مساوی از دو قطب دور زمین می‌چرخد. دایره‌هایی که در هر دو نیمکره موازی استوا رسم می‌شوند <b>مدار</b> نام دارند. هرچه به قطب نزدیک‌تر شویم مدارها <b>کوچک‌تر</b> می‌شوند.</p><div class='key'>استوا = مدار مبدأ = ۰°. مدارهای دیگر از ۰ تا ۹۰ درجهٔ شمالی (N) یا جنوبی (S) درجه‌بندی می‌شوند. قطب‌ها ۹۰° هستند و فقط یک نقطه‌اند.</div><p>مدارهای مهم: استوا (۰°)، <b>رأس‌السرطان</b> (۲۳°۲۷′ شمالی)، <b>رأس‌الجدی</b> (۲۳°۲۷′ جنوبی)، و مدارهای قطبی شمال و جنوب (حدود ۶۶°۳۳′).</p><div class='tip'>مثال: همهٔ شهرهایی که روی یک مدار قرار دارند، «عرض جغرافیایی» یکسان دارند (مثل صندلی‌های یک ردیف در کلاس).</div>"],["۳) نصف‌النهارها: «طول‌های» زمین","<p>نصف‌النهار نیم‌دایرهٔ فرضی است که از قطب شمال تا قطب جنوب کشیده شده و همهٔ نصف‌النهارها هم‌اندازه‌اند (مثل برش‌های پرتقال). نصف‌النهار <b>مبدأ</b> از رصدخانهٔ <b>گرینویچ لندن</b> می‌گذرد (۰°) و همراه امتدادش در سوی دیگر، زمین را به نیمکرهٔ <b>شرقی</b> و <b>غربی</b> تقسیم می‌کند.</p><div class='key'>چون محیط زمین ۳۶۰° است، نصف‌النهارها از ۰ تا ۱۸۰° شرقی (E) و ۰ تا ۱۸۰° غربی (W) درجه‌بندی می‌شوند. هر درجه یک زاویه در داخل کره است.</div><svg viewBox='0 0 200 140'><circle cx='100' cy='70' r='60' fill='none' stroke='#22d3ee' stroke-width='2'/><ellipse cx='100' cy='70' rx='60' ry='18' fill='none' stroke='#fbbf24'/><ellipse cx='100' cy='70' rx='24' ry='60' fill='none' stroke='#a78bfa'/><line x1='100' y1='10' x2='100' y2='130' stroke='#f0abfc'/><line x1='40' y1='45' x2='160' y2='45' stroke='#fbbf24' stroke-dasharray='3'/><g fill='currentColor' font-size='9'><text x='162' y='72'>استوا ۰°</text><text x='104' y='20'>مبدأ (گرینویچ)</text><text x='162' y='48'>مدار (عرض)</text></g></svg>"],["۴) طول و عرض جغرافیایی (مختصات)","<p>هر نقطه روی یک مدار و یک نصف‌النهار است؛ محل برخورد آن دو، «مختصات» نقطه است.</p><table><tr><th></th><th>عرض جغرافیایی</th><th>طول جغرافیایی</th></tr><tr><td>یعنی</td><td>فاصله تا استوا</td><td>فاصله تا نصف‌النهار مبدأ</td></tr><tr><td>با</td><td>درجه + N یا S</td><td>درجه + E یا W</td></tr><tr><td>مثال</td><td>۴۵°N</td><td>۶۰°E</td></tr></table><div class='tip'><b>بپرس از خودت:</b> سه مکان روی یک مدار → عرض یکسان (طول متفاوت). سه مکان روی یک نصف‌النهار → طول یکسان (عرض متفاوت). ایران در نیمکرهٔ شمالی و شرقی است.</div>"],["۵) ماهواره و ناوبری، جهت قبله","<p>قدیمی‌ها با ستاره، <b>اسطرلاب</b> و قطب‌نما مسیر می‌یافتند. امروز ناوبری ماهواره‌ای با امواج رادیویی بین ماهواره و گیرنده، مکان و مسیر را می‌دهد: GPS (آمریکا)، گلوناس (روسیه)، بیدو (چین). ایران در اردیبهشت ۱۳۹۹ ماهوارهٔ <b>نور</b> را با ماهواره‌بر <b>قاصد</b> به مدار فرستاد.</p><div class='key'><b>فایده:</b> تعیین مکان، سرعت، مسافت و ارتفاع؛ امداد؛ نقشه‌برداری؛ کشاورزی و محیط زیست. <b>تهدید:</b> وابستگی به کشور دیگر؛ مثلاً اگر موشک‌هایمان فقط به GPS تکیه کنند ممکن است دچار اختلال یا فریب شوند.</div><p><b>قبله:</b> مکه نسبت به ایران در جنوب غربی است؛ اول جنوب را پیدا می‌کنیم و کمی به غرب می‌چرخیم. مردم بندرعباس نسبت به تبریز بیشتر به غرب متمایل می‌شوند.</p>"],["✅ خلاصه و چک‌لیست امتحانی","<p>☑ ۸ سیاره و ترتیب‌شان ☑ درونی جامد/بیرونی گازی ☑ راه شیری و سال نوری ☑ استوا و مدار ۰–۹۰ ☑ نصف‌النهار مبدأ گرینویچ ۰–۱۸۰ ☑ طول از مبدأ، عرض از استوا ☑ N,S,E,W ☑ GPS و ماهواره نور ☑ جهت قبله در ایران: جنوب غربی.</p>"]],
1:[["۱) حرکت وضعی و شب و روز","<p>زمین هر <b>۲۴ ساعت</b> یک بار به دور محور خود می‌چرخد (از <b>غرب به شرق</b>). نیمی که رو به خورشید است روز و نیم دیگر شب است. اگر زمین نمی‌چرخید، یک نیمه همیشه روز و داغ و نیم دیگر همیشه شب و منجمد بود.</p><div class='key'>طلوع و غروب خورشید <b>حرکت ظاهری</b> است؛ در واقع زمین می‌چرخد. مثل نشستن در قطار که درخت‌ها عقب می‌روند.</div><p>خداوند شب و روز و خورشید و ماه را در خدمت شما گذاشت (نحل، آیهٔ ۱۲).</p>"],["۲) اختلاف ساعت","<p>وقتی خورشید بالای یک نصف‌النهار است، <b>همهٔ شهرهای روی آن</b> هم‌زمان ظهر دارند. چون زمین از غرب به شرق می‌چرخد، <b>شرق زودتر</b> خورشید را می‌بیند: وقتی در گرینویچ ظهر است، شرق آن از ظهر گذشته و غرب هنوز به ظهر مانده.</p><div class='tip'><b>مثال:</b> ساعت ۱۱ صبح ایران، در مالزی (شرق‌تر) بعدازظهر و در مکزیکوسیتی (غرب‌تر) نیمه‌شب است. هند طلوع را زودتر از ایران می‌بیند و ظهر در ایران زودتر از عربستان (غرب‌تر) می‌رسد.</div><p>زمان نماز هم به همین دلیل در جاهای مختلف فرق می‌کند.</p>"],["۳) ساعت واقعی و ساعت رسمی","<p><b>ساعت واقعی</b> بر اساس موقعیت خورشید است؛ دو شهر هم‌جوار که روی یک نصف‌النهار نیستند ساعت متفاوت دارند و برنامهٔ قطار و هواپیما بههم می‌ریزد. در قرن ۱۹ کشورها <b>ساعت رسمی</b> را پذیرفتند.</p><div class='key'>۳۶۰° ÷ ۲۴ ساعت = <b>۱۵°</b> برای هر منطقهٔ زمانی (قاچ). نصف‌النهارهای یک قاچ ساعت یکسان دارند و هر قاچ یک نصف‌النهار مرکزی دارد (۷/۵° دو طرف).</div><p>ایران با اینکه در بیش از یک قاچ است یک ساعت دارد: ساعت ۸ تبریز و مشهد یکی است. کشورهای بسیار وسیع، چند ساعت رسمی دارند. <b>خط بین‌المللی تاریخ</b> نصف‌النهار ۱۸۰° است که با عبور از آن تقویم یک روز تغییر می‌کند. طبق کتاب، ساعت رسمی ایران اول فروردین یک ساعت جلو و ۳۰ شهریور یک ساعت عقب می‌رفت تا از نور روز بیشتر استفاده شود.</p>"],["۴) حرکت انتقالی و سال کبیسه","<p>گردش زمین به دور خورشید روی مدار <b>بیضی</b> با سرعت متوسط ۳۰ km/s یک <b>سال</b> طول می‌کشد.</p><table><tr><th>سال واقعی</th><th>سال رسمی</th><th>کسری</th></tr><tr><td>۳۶۵ روز و ۶ ساعت</td><td>۳۶۵ روز</td><td>۶ ساعت</td></tr></table><div class='key'>۴ × ۶ = ۲۴ ساعت = یک روز، پس هر ۴ سال یک روز به سال رسمی اضافه می‌شود: <b>سال کبیسه ۳۶۶ روزه</b>.</div><div class='tip'><b>تمرین کتاب:</b> ۳۰ km/s × ۳۶۰۰ = ۱۰۸٬۰۰۰ کیلومتر در ساعت.</div>"],["۵) کجی محور و پیدایش فصل‌ها","<p>محور چرخش زمین بر سطح مدار انتقالی <b>مایل</b> است (۲۳°۲۷′ از خط عمود). به همین دلیل زاویهٔ تابش در طول سال عوض می‌شود، طول شب و روز نابرابر می‌شود و فصل‌ها پدید می‌آیند.</p><table><tr><th></th><th>اول تیر</th><th>اول دی</th></tr><tr><td>خورشید عمود بر</td><td>رأس‌السرطان</td><td>رأس‌الجدی</td></tr><tr><td>نیمکرهٔ شمالی</td><td>بلندترین روز، آغاز تابستان (انقلاب تابستانی)</td><td>کوتاه‌ترین روز، آغاز زمستان (انقلاب زمستانی)</td></tr><tr><td>نیمکرهٔ جنوبی</td><td>زمستان</td><td>تابستان</td></tr></table><svg viewBox='0 0 300 120'><circle cx='40' cy='60' r='26' fill='#fbbf24'/><circle cx='190' cy='60' r='24' fill='#0ea5e9'/><line x1='175' y1='20' x2='205' y2='100' stroke='#f0abfc' stroke-width='3'/><g stroke='#fbbf24'><line x1='70' y1='40' x2='160' y2='50'/><line x1='70' y1='80' x2='160' y2='70'/></g><g fill='currentColor' font-size='10'><text x='225' y='30'>محور کج ۲۳°۲۷′</text><text x='225' y='95'>نور مستقیم‌تر = گرم‌تر</text></g></svg><div class='key'><b>اعتدالین:</b> اول بهار و اول پاییز شب و روز برابر است. در منطقهٔ استوا همیشه شب و روز مساوی است (فصل مشخص ندارد). در اول تیر در مدار قطبی شمال روز ۲۴ ساعته و در قطبی جنوب شب ۲۴ ساعته است.</div><p>جهت تابش خورشید در کشاورزی (زمان کشت) و معماری خانه‌ها (جهت پنجره‌ها) اثر دارد.</p>"],["✅ خلاصه و چک‌لیست امتحانی","<p>☑ وضعی: ۲۴ ساعت، غرب به شرق ← شب و روز و اختلاف ساعت ☑ شرق زودتر ظهر می‌شود ☑ قاچ ۱۵° ☑ ایران یک ساعت ☑ انتقالی: ۳۶۵ روز و ۶ ساعت ☑ کبیسه هر ۴ سال ☑ محور کج + انتقالی = فصل‌ها ☑ اول تیر/اول دی/اعتدالین.</p>"]]};
Object.assign(R,{2:[["۱) چهار محیط زمین","<p>سیارهٔ ما چهار محیط دارد:</p><table><tr><th>محیط</th><th>چیست؟</th></tr><tr><td>سنگ‌کره (لیتوسفر)</td><td>پوستهٔ جامد؛ سنگ و خاک</td></tr><tr><td>آب‌کره (هیدروسفر)</td><td>اقیانوس‌ها، دریاها، دریاچه‌ها، رودها، آب زیرزمینی، یخچال‌ها و ریزش‌های جوی</td></tr><tr><td>هواکره (اتمسفر)</td><td>گازهای دور زمین: ۷۸٪ نیتروژن، ۲۱٪ اکسیژن، ۱٪ سایر گازها</td></tr><tr><td>زیست‌کره (بیوسفر)</td><td>همهٔ موجودات زنده</td></tr></table><div class='key'>سه محیط اول با هم زمین را برای زندگی مناسب می‌کنند: خاک برای رویش گیاه، آب برای نوشیدن و کشاورزی، هوا برای تنفس. (آیهٔ ۲۲ بقره و ۲۹ شوری)</div>"],["۲) خشکی‌ها و آب‌ها","<p>حدود <b>۷۱ درصد</b> سطح زمین آب است. نیمکرهٔ شمالی: ۴۰٪ خشکی و ۶۰٪ آب؛ نیمکرهٔ جنوبی: ۱۸٪ خشکی و ۸۲٪ آب (پس آب نیمکرهٔ جنوبی بیشتر است).</p><div class='tip'>پنج قاره در کتاب: آسیا، اروپا، آفریقا، آمریکا، استرالیا و اقیانوسیه.</div>"],["۳) ناهمواری‌های خشکی","<p>سطح خشکی‌ها صاف نیست: فلات، کوه، تپه، دشت و جلگه. رنگ سبز نقشه = جلگه و دشت (پست)؛ رنگ زرد و قهوه‌ای = فلات و کوه بلند. جلگه‌ها کنار دریا یا رود بزرگ پدید می‌آیند.</p><div class='key'><b>فلات:</b> سرزمین نسبتاً هموار اما مرتفع که از اطراف به سرزمین پست می‌رسد. فلات تبت بلندترین فلات جهان است. بلندترین قله: اورست (۸۸۴۸ متر)؛ ژرف‌ترین نقطه: گودال ماریانا (حدود ۱۱ هزار متر).</div><table><tr><th></th><th>کوه جوان (بلند)</th><th>کوه کم‌ارتفاع (قدیمی)</th></tr><tr><td>قله</td><td>نوک‌تیز</td><td>گنبدی</td></tr><tr><td>شیب دامنه</td><td>تند</td><td>ملایم</td></tr><tr><td>دره</td><td>تنگ، شکل V</td><td>باز، شکل U</td></tr></table>"],["۴) چرا ناهمواری‌ها تغییر می‌کنند؟","<h4>عوامل درونی</h4><p>پوستهٔ زمین به <b>ورقه‌ها</b> تقسیم شده که روی گوشتهٔ خمیری می‌لغزند و سالانه فقط چند سانتی‌متر جابه‌جا می‌شوند؛ اما در میلیون‌ها سال تغییر بزرگ می‌سازند. وقتی به هم برخورد کنند کوه‌های <b>چین‌خورده</b> و رشته‌کوه پدید می‌آید؛ شکستگی یعنی <b>گسل</b> و زلزله؛ ماگما که به سطح برسد کوه <b>آتشفشان</b> می‌سازد.</p><h4>عوامل بیرونی</h4><p>هوازدگی و فرسایش آبی، بادی و یخچالی چهرهٔ ناهمواری‌ها را تغییر می‌دهند.</p><h4>عامل انسانی</h4><p>معدن، سد و جاده، تونل، کشت پلکانی برنج، خانه‌های تراشیده در سنگ (کندوان) نمونه‌هایی از دخالت انسان در ناهمواری‌ها هستند.</p>"],["✅ خلاصه","<p>☑ چهار محیط ☑ ۷۱٪ آب ☑ سبز پست/زرد و قهوه‌ای بلند ☑ تبت و اورست و ماریانا ☑ دره V جوان، U قدیمی ☑ ورقه‌ها، گسل، آتشفشان ☑ عوامل درونی/بیرونی/انسانی.</p>"]],
3:[["۱) اقیانوس‌ها و کف آن‌ها","<p>پنج اقیانوس: آرام، اطلس، هند، منجمد شمالی و منجمد جنوبی. آرام <b>پهناورترین و عمیق‌ترین</b> است (۱۰۰ برابر ایران).</p><p>کف اقیانوس‌ها هم مثل خشکی ناهموار است: <b>فلات قاره</b> (عمق کمتر از ۲۰۰ متر، پرنفت و گاز و ماهی) ← <b>شیب قاره</b> (شیب ناگهانی) ← دشت اقیانوسی ← گودال اقیانوسی.</p><div class='tip'>چرا سفر به اعماق اقیانوس سخت‌تر از صعود به قله است؟ فشار زیاد آب، تاریکی و دمای کم. صدها نفر به اورست رفته‌اند اما فقط سه نفر با زیردریایی به ماریانا.</div>"],["۲) حرکت آب و نقش آن برای انسان","<p>حرکات آب: موج، جزر و مد و جریان دریایی. جریان گرم و سرد آب‌وهوای کناره‌ها را تغییر می‌دهند؛ جای تلاقی آن‌ها (مثل نیوفوندلند و شرق ژاپن) از بهترین مناطق ماهیگیری است.</p><div class='key'><b>فایده:</b> غذا، حمل‌ونقل ارزان با کشتی، و به‌صورت غیرمستقیم آب شیرین. <b>تهدید:</b> زباله و پلاستیک، دفن پسماند اتمی در اعماق، و صید بی‌رویه با رادار و تور دائم.</div><p>خبر خوب: ۱۹۰ کشور عضو سازمان ملل برای معاهدهٔ حفاظت از اقیانوس‌ها توافق کردند.</p>"],["۳) هواکره و لایه‌های آن","<p>هواکره (جو) تا حدود ۳۰۰۰ کیلومتر بالای زمین است: ۷۸٪ نیتروژن، ۲۱٪ اکسیژن، باقی مثل دی‌اکسید کربن و بخار آب.</p><table><tr><th>لایه (از پایین)</th><th>ویژگی</th></tr><tr><td>وردسپهر (تروپوسفر)</td><td>نزدیک زمین؛ ابر و تغییرات آب‌وهوایی</td></tr><tr><td>ازن‌سپهر (استراتوسفر)</td><td>لایهٔ ازن در آن است (محافظ زمین)</td></tr><tr><td>میان‌سپهر، یون‌سپهر، برون‌سپهر</td><td>لایه‌های بالاتر تا فضا</td></tr></table>"],["۴) ۴ عامل مؤثر بر آب‌وهوا","<table><tr><th>عامل</th><th>اثر</th></tr><tr><td>۱ زاویهٔ تابش و عرض جغرافیایی</td><td>هرچه از استوا دور شویم تابش مایل‌تر و هوا سردتر است. سه منطقه: گرم، معتدل (شمالی و جنوبی)، سرد</td></tr><tr><td>۲ دوری و نزدیکی به دریا</td><td>خشکی زود گرم و زود سرد می‌شود؛ آب گرما را ذخیره می‌کند ← دریا آب‌وهوا را معتدل می‌کند. جریان گرم، زمستان را ملایم‌تر و جریان سرد، سرما را شدیدتر می‌کند</td></tr><tr><td>۳ ارتفاع</td><td>به ازای هر ۱۰۰۰ متر، دما ۶°C کم می‌شود</td></tr><tr><td>۴ فشار هوا و باد</td><td>هوا از پرفشار به کم‌فشار می‌رود ← باد</td></tr></table><div class='key'>هوای <b>گرم</b> سبک است، بالا می‌رود و <b>کم‌فشار</b> است؛ هوای <b>سرد</b> سنگین است، پایین می‌آید و <b>پرفشار</b> است.</div><div class='tip'><b>مثال:</b> استکهلم و برگن هم‌عرضند اما برگن (کنار اقیانوس) در دی گرم‌تر است. هرچه از داخل به ساحل برویم، سرمای زمستان کم‌تر می‌شود.</div>"],["۵) انسان و تغییر اقلیم","<p><b>تغییر اقلیم</b> یعنی دگرگونی بلندمدت در دما، بارش و شرایط جوی. میانگین دمای زمین در صد سال گذشته بالا رفته؛ علت: سوخت‌های فسیلی (نفت، گاز، زغال‌سنگ)، خودروها و صنایع که گازهای گلخانه‌ای می‌سازند؛ کتاب بیشترین نقش را به کشورهای صنعتی به‌ویژه آمریکا نسبت می‌دهد.</p><div class='key'><b>پیامدها:</b> ذوب یخ قطبی و بالا آمدن دریا، خشکسالی و سیل، تهدید غذا، بیماری، مهاجرت اجباری، آتش‌سوزی و انقراض گونه‌ها.</div><p>راه مقابله: صرفه‌جویی در انرژی و استفادهٔ دقیق از منابع؛ انرژی هسته‌ای هم در کاهش آلودگی می‌تواند کمک کند.</p>"],["✅ خلاصه","<p>☑ آرام بزرگ‌ترین ☑ فلات قاره &lt; ۲۰۰ متر ☑ تلاقی جریان گرم و سرد = صید ☑ وردسپهر = آب‌وهوا ☑ ۴ عامل آب‌وهوا ☑ هر ۱۰۰۰ متر = ۶°C ☑ تغییر اقلیم و گاز گلخانه‌ای.</p>"]],
4:[["۱) زیست‌بوم چیست و چه عواملی آن را می‌سازند؟","<p><b>زیست‌بوم (بیوم)</b> ناحیه‌ای وسیع که گیاهان و جانوران خاصی دارد و از چند <b>بوم‌سازگان</b> (اکوسیستم) ساخته شده. عوامل: آب‌وهوا، ناهمواری، ارتفاع، جنس خاک؛ مهم‌ترین آن‌ها <b>آب‌وهوا</b> و در آن <b>دما و بارش</b>.</p><div class='tip'>مثال: دما خیلی پایین → گیاه نمی‌روید. بارش کم → پوشش کم. طول فصل خشک و تبخیر هم مؤثرند. گودی زمین را به ۸ زیست‌بوم تقسیم کرد.</div>"],["۲) ۸ زیست‌بوم جهان","<p>توندرا، تایگا، جنگل پهن‌برگ معتدل، علفزار منطقهٔ معتدل، مدیترانه‌ای، بیابان، جنگل بارانی استوایی و ساوان. (در کتاب سه مورد اول فقط نام و جایشان روی نقشه آمده.)</p><table><tr><th>زیست‌بوم</th><th>ویژگی مهم</th></tr><tr><td>توندرا</td><td>نزدیک قطب شمال؛ زمستان بلند، تا ۳۴- درجه؛ تابستان کوتاه (حداکثر ۱۲°)؛ فقط خزه و گل‌سنگ؛ خرس قطبی، روباه قطبی، گوزن شمالی</td></tr><tr><td>تایگا</td><td>جنوب توندرا (آسیا، اروپا، آمریکای شمالی)؛ ۶ ماه زیر صفر؛ بارش ۲۵۰ تا ۵۰۰ mm؛ مخروطیان و سوزنی‌برگ (کاج، سرو) همیشه سبز؛ کاغذ و جنگل‌های کانادا</td></tr><tr><td>جنگل بارانی استوایی</td><td>نزدیک استوا؛ هوای همیشه گرم، رطوبت ۸۰٪، بارش حدود ۲۵۰۰ mm؛ چندطبقه (درختان ۲۵ تا ۳۵ متر)؛ بیشترین تنوع زیستی</td></tr><tr><td>ساوان</td><td>علفزار با درختان تک و منفرد (بائوباب)؛ آفریقا؛ گرم، دو فصل خشک و مرطوب؛ فیل، زرافه، گورخر، کرگدن، شیر</td></tr><tr><td>بیابان</td><td>بارش سالانه کمتر از ۵۰ mm؛ نزدیک مدارهای رأس‌السرطان و رأس‌الجدی (صحرا، ربع‌الخالی، لوت)؛ گبی بیابان سرد است؛ گیاهان خاردار یا ذخیره‌کنندهٔ آب</td></tr></table>"],["✅ خلاصه","<p>☑ مهم‌ترین عامل = آب‌وهوا (دما + بارش) ☑ ۸ زیست‌بوم ☑ توندرا: خزه؛ تایگا: مخروطیان؛ استوایی: بیشترین تنوع؛ ساوان: بائوباب؛ بیابان: &lt;۵۰ mm.</p>"]],
5:[["۱) انقراض و تخریب زیستگاه","<p>انقراض یعنی مرگ آخرین عضو یک گونه؛ دیگر تولیدمثلی نمی‌شود و گونه برای همیشه ناپدید می‌شود. در دو قرن اخیر تغییرات زیست‌بوم‌ها بیشتر از تمام عمر زمین بوده و ده‌ها گونه منقرض شده.</p><div class='key'><b>علل تخریب زیستگاه:</b> ۱ گسترش بی‌برنامهٔ شهر، جاده، پل و سد ۲ فعالیت صنعتی و تولید انبوه ۳ مصرف‌گرایی و زباله ۴ شکار، صید بی‌رویه و تجارت اعضای حیوانات.</div>"],["۲) جنگل‌های بارانی استوایی، «ریهٔ زمین»","<p>پیچیده‌ترین زیست‌بوم و دارای غنی‌ترین تنوع زیستی. کارکرد: جذب دی‌اکسید کربن و تبدیل آن به اکسیژن، کمک به آب و رطوبت هوا ← به همین دلیل «ریه‌های زمین» نامیده می‌شوند.</p><div class='tip'><b>فراورده‌ها:</b> موز، نارگیل، انبه؛ قهوه، کاکائو، روغن، کائوچو، الاستیک، خمیردندان؛ عصارهٔ گیاهان استوایی در بیشتر داروهای معالجهٔ سرطان.</div><p><b>جنگل‌زدایی</b> یعنی از بین بردن کامل جنگل: در برزیل و اندونزی و آمازون به‌خاطر کشاورزی، دامداری، الوار و معدن طلا و بوکسیت.</p>"],["✅ خلاصه","<p>☑ انقراض = مرگ آخرین عضو ☑ ۴ علت تخریب زیستگاه ☑ ریه‌های زمین = جنگل بارانی استوایی ☑ جنگل‌زدایی در برزیل و اندونزی.</p>"]]});
var K=function(x){return"<div class='key'>"+x+"</div>"},Tp=function(x){return"<div class='tip'>"+x+"</div>"},TB=function(h,r){return"<table><tr>"+h.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr>"+r.map(function(a){return"<tr>"+a.map(function(x){return"<td>"+x+"</td>"}).join("")+"</tr>"}).join("")+"</table>"};
Object.assign(R,{6:[["۱) رشد جمعیت جهان","<p>جمعیت جهان در ۲۰۲۲ از <b>۸ میلیارد</b> گذشت و در ۲۰۵۰ به حدود <b>۱۱ میلیارد</b> می‌رسد. در سال‌های طولانی رشد کند بود؛ در دویست سال اخیر صعودی شد، چون مرگ‌ومیر (به‌ویژه کودکان) کم شد. پیش‌تر بیماری‌های واگیر، گرسنگی و جنگ مردم را می‌کشت.</p>"+K("دو عامل کاهش مرگ‌ومیر: <b>۱ بهبود بهداشت</b> (پزشکی و مهار وبا و طاعون) <b>۲ بهبود تغذیه</b> (کشاورزی صنعتی + حمل‌ونقل غذا)")],["۲) رشد طبیعی و رشد منفی",""+TB(["موالید و مرگ","نتیجه"],[["موالید &gt; مرگ","جمعیت زیاد می‌شود"],["موالید = مرگ","ثابت"],["موالید &lt; مرگ","کاهش (رشد منفی)"]])+K("رشد طبیعی = (موالید − مرگ‌ومیر) ÷ ۱۰۰۰ × ۱۰۰. مثال: ۲۱ در هزار = <b>۲/۱٪</b>")+"<p>رشد منفی یعنی جمعیت سالخورده‌تر و کمبود نیروی جوان برای تحصیل و کار. برخی کشورها با جایزه، کمک مالی، مسکن، معافیت مالیاتی و مرخصی مادران فرزندآوری را تشویق می‌کنند.</p>"+Tp("اگر برای آموزش و شغل جوانان برنامه و سرمایه‌گذاری شود، جمعیت جوان یک نعمت بزرگ است.")],["۳) پراکندگی جمعیت","<p>جمعیت ناموزون پخش شده: کم‌تراکم (سیبری، کانادا، استرالیا، لیبی و چاد) و پرتراکم (چین، هند، بنگلادش، ژاپن، اروپا).</p>"+TB(["عوامل جذب","عوامل دفع"],[["معتدل با باران کافی، موسمی، جلگه آبرفتی حاصلخیز، آب فراوان","گرم و خشک، مرتفع و سرد، کم‌آب، خاک نابارور"],["شهرهای بزرگ، پایتخت، صنعتی، گردشگری و زیارتی، امکانات آموزشی و بهداشتی","نبود امکانات، جنگ و آشوب"]])],["۴) مهاجرت","<p>مهاجرت یعنی رفتن از جایی به جای دیگر برای کار یا زندگی. <b>داخلی</b> (درون مرز، مثل روستا به شهر) یا <b>خارجی</b> (بین‌المللی).</p>"+TB(["اختیاری","اجباری"],[["با میل خود برای زندگی بهتر. مثال: بیش از ۱۰۰ میلیون اروپایی در قرن ۱۹ و ۲۰ به آمریکا و استرالیا","بدون میل: قحطی، خشکسالی، جنگ. مثال: فلسطینی‌ها، مردم افغانستان، سوریه و عراق؛ روآندا ۱۹۹۴ (بیش از ۴۰۰ هزار نفر در چهار روز)"]])+Tp("کاهش ناگهانی جمعیت ممکن است از نسل‌کشی، اسارت و جابه‌جایی اجباری باشد (مثل بومیان استرالیا و آمریکا و بردگان آفریقایی) و اقتصاد آن منطقه را سال‌ها ضعیف می‌کند.")],["۵) شهرنشینی","<p>در ۱۹۵۰ فقط ۲۵٪ مردم جهان شهرنشین بودند؛ امروز بیش از <b>۵۰٪</b>. علت: مهاجرت روستاییان به شهر برای درآمد و امکانات.</p>"+K("مشکلات شهرنشینی بدون برنامه: ترافیک، آلودگی هوا، اختلاف طبقاتی، زاغه‌نشینی حومه، بی‌خانمانی. راه‌حل: تقویت امکانات و اقتصاد روستایی")],["✅ خلاصه","<p>☑ ۸ میلیارد ۲۰۲۲ → ۱۱ میلیارد ۲۰۵۰ ☑ بهداشت + تغذیه ☑ رشد = (موالید−مرگ)÷۱۰۰۰×۱۰۰ ☑ رشد منفی → سالخوردگی ☑ جذب/دفع ☑ مهاجرت اختیاری/اجباری ☑ شهرنشینی ۲۵٪→۵۰٪.</p>"]],
7:[["۱) نابرابری جهانی و علت‌های آن","<p>بیش از ۲۰۰ کشور در جهان هست و در ثروت، آموزش، بهداشت، مسکن و اشتغال با هم تفاوت دارند → <b>نابرابری جهانی</b>.</p>"+TB(["عوامل خارجی","عوامل داخلی"],[["استعمار و غارت منابع توسط انگلستان، آمریکا، فرانسه؛ اشغال نظامی؛ دخالت و جلوگیری از استقلال","وابستگی حکومت به بیگانه، استبداد، عادت‌های غلط (تنبلی)، مدیریت ضعیف، غفلت از استعدادها، نبود وحدت"]])],["۲) شاخص توسعهٔ انسانی (HDI)","<p>فقط عامل اقتصادی کافی نیست؛ هویت، عزت، امنیت، آزادی و رضایت هم مهم‌اند. شاخص توسعهٔ انسانی سه معیار دارد:</p>"+K("۱ درآمد و رفاه ۲ امید به زندگی (متوسط طول عمر) ۳ سواد و آموزش")+"<p>کشورها در <b>چهار گروه</b> (بالا، متوسط، پایین، خیلی پایین) قرار می‌گیرند و ایران در گروه «توسعهٔ انسانی بالا» است و شاخص آن در بیست سال اخیر بالا رفته.</p>"],["۳) الف) درآمد و رفاه","<p>تخمین می‌زنند ۸۰٪ درآمد جهان در دست ۲۰٪ مردم است. میلیون‌ها نفر سالانه از گرسنگی می‌میرند.</p>"+K("<b>تولید ناخالص داخلی (GDP)</b> = ارزش همهٔ محصولات یک سال در یک کشور. <b>درآمد سرانه</b> = GDP ÷ جمعیت. سرانه فقط متوسط است؛ نشان نمی‌دهد همه یکسان درآمد دارند")+"<p>رشد اقتصادی ثابت نیست: ژاپن، چین و سنگاپور و کره‌جنوبی با صنعت و صادرات رشد کردند؛ سوریه و عراق به‌دلیل بحران و جنگ کاهش دیدند. درآمد بالای بعضی کشورها فقط از فروش مواد خام (نفت) است و در آینده مشکل ایجاد می‌کند.</p>"],["۴) ب) امید به زندگی و پ) سواد","<p><b>امید به زندگی</b>: تعداد سال‌هایی که انتظار می‌رود کودک تازه‌متولد زنده بماند و نشانهٔ سلامت جامعه است. هوای پاک، غذا و آب سالم و درمان پیشرفته → عمر بیشتر. مثال: ژاپن حدود ۸۵ سال، ایران حدود ۷۷ سال، چند کشور فقیر آفریقایی حدود ۵۵ سال.</p><p><b>سواد و آموزش</b>: میزان باسوادی بزرگسالان، <b>میانگین سال‌های تحصیل</b> (آلمان حدود ۱۴ سال، ایران حدود ۱۰/۴، چند کشور فقیر کمتر از ۵) و تعداد معلم به ازای دانش‌آموز.</p>"],["✅ خلاصه","<p>☑ عوامل خارجی (استعمار، اشغال، دخالت) و داخلی (وابستگی، استبداد، تنبلی، مدیریت) ☑ HDI = درآمد + عمر + آموزش ☑ ۴ گروه، ایران «بالا» ☑ ۸۰٪ ثروت در دست ۲۰٪ ☑ سرانه = GDP ÷ جمعیت.</p>"]],
8:[["۱) ایران پیش از صفویه و تشکیل حکومت","<p>ایران تجزیه شده بود؛ حاکمان با هم می‌جنگیدند و امنیت شهر و روستا نبود. همسایه‌ها طمع داشتند: <b>عثمانی</b> (غرب، که خلیفه می‌دانست خود را) و <b>ازبک‌ها</b> (شمال‌شرق).</p>"+Tp("عثمانی: عثمان آن را در آسیای صغیر پایه گذاشت؛ سه قاره را گرفت؛ ۶۰۰ سال حکومت کرد و با پایان جنگ جهانی اول از میان رفت.")],["۲) شیخ صفی‌الدین و شاه اسماعیل","<p>شیخ صفی‌الدین اردبیلی (۶۵۰–۷۳۵ ق) شیعه بود و خانقاهش در اردبیل مورد توجه بود (آرامگاه او در میراث جهانی یونسکو ثبت شده). فرزندانش شیعه‌گری را گستردند و ایل‌های ترک شمال و شمال‌غرب شیعه شدند و <b>قزلباش</b> نامیده شدند.</p>"+K("اسماعیل (نوهٔ شیخ صفی، قرن ۱۰ ق) با قزلباش‌ها حکومت‌های محلی را شکست، <b>تبریز</b> را گرفت، خود را شاه خواند، مذهب <b>شیعه</b> را رسمی کرد و با شکست ازبک‌ها بر سراسر ایران مسلط شد. نتیجه: ایرانی یکپارچه، مستقل و قوی با قلمروی حدود ساسانیان و همبستگی اقوام ایرانی")],["۳) جنگ چالدران","<p>سلطان عثمانی از تشکیل حکومت شیعه و مستقل ناخرسند بود. در <b>چالدران</b> (نزدیک خوی) سپاه ایران شجاعت نشان داد اما عثمانی با <b>توپ و تفنگ</b> كه ایران نداشت پیروز شد و تبریز مدتی اشغال شد؛ اما مقاومت مردم آنان را واداشت عقب نشینی کنند.</p>"+Tp("درس: بدون سلاح و فناوری روز، شجاعت کافی نیست.")],["۴) تهماسب و شاه عباس اول","<p>تهماسب (پسر اسماعیل) حکومت را تثبیت کرد و پایتخت را از تبریز به <b>قزوین</b> برد (تبریز در معرض حمله عثمانی بود). <b>شاه عباس اول</b> (پنجمین شاه صفوی) ازبک و عثمانی را عقب راند و پایتخت را از قزوین به <b>اصفهان</b> (مرکز ایران) برد و حکومت صفوی را به اوج رساند.</p>"+K("مسیر پایتخت: تبریز ← قزوین ← اصفهان")],["۵) سقوط صفویه","<p>پس از شاه عباس، چهار پادشاه بیلیاقت آمدند. «کشتن و کور کردن شاهزاده‌ها» آن‌ها را از کشورداری محروم کرد، مقامات با هم اختلاف پیدا کردند و هرج‌ومرج شد. افغان‌های قندهار شوریدند و پس از محاصره‌ای چندماهه، سلطان حسین تسلیم شد و <b>محمود افغان</b> بر اصفهان مسلط شد.</p>"],["✅ خلاصه","<p>☑ قزلباش، شیخ صفی، اسماعیل و تبریز ☑ مذهب رسمی شیعه ☑ چالدران: توپ و تفنگ ☑ تهماسب؛ قزوین ☑ شاه عباس؛ اصفهان ☑ سقوط: شاهزاده‌ها، هرج‌ومرج، افغان‌ها.</p>"]],
9:[["۱) جامعه و درآمد حکومت","<p>در صفویه نظم و امنیت برقرار شد و زندگی اجتماعی و اقتصادی رونق گرفت. جمعیت: حدود <b>۱۰ میلیون</b>؛ بیشترین روستاییان و کوچ‌نشینان بودند؛ ۱۰ تا ۱۵٪ شهرنشین (مقامات، نظامیان، روحانیان، بازرگان، پیشه‌وران). شاردن (جهانگرد اروپایی) وضع دهقانان ایرانی را بهتر از اروپا می‌دانست.</p>"+K("منابع درآمد حکومت: ۱ مالیات کشاورزان و دامداران ۲ عوارض کاروان‌های تجاری ۳ صادرات ابریشم (انحصار شاه عباس)")],["۲) صنعت","<p>ابریشم، پارچه‌های مخملی، زربفت، حریر و قالی‌های نفیس تولید و صادر می‌شد. کارگاه‌های بافندگی در اصفهان، کاشان، یزد، مشهد، استرآباد و گیلان با نساجی اروپا رقابت می‌کردند و بیشترشان متعلق به شاه و خاندان او بود. کاشان: مخمل و ساتن و زربفت (گزارش شاردن).</p>"+Tp("فرش متعلق به دورهٔ تهماسب: ۱۷ رنگ طبیعی و دوام بیش از ۴۰۰ سال. صنعت‌گران در کاشی، چینی، چرم، جواهر، صابون و جنگ‌افزار هم ماهر بودند؛ اسطرلاب کار نمونه‌ای مهم است.")],["۳) تجارت","<p>یکپارچگی و امنیت → تجارت پررونق. شبکه راه‌ها و کاروان‌سراها (اقامت رایگان، ماموران راهداری) و بازار قیصریه اصفهان (شمال میدان نقش جهان) ساخته شد. شاه عباس اول به شرکت‌های تجاری اروپایی اجازهٔ فعالیت داد.</p>"+K("سه عامل گسترش تجارت: ۱ یکپارچگی و امنیت ۲ راه و کاروانسرا ۳ اجازه به شرکت‌های اروپایی")],["۴) علم، هنر و جشن‌ها","<p><b>علم:</b> مدرسه‌ها و کتابخانه‌ها وقف شدند؛ علوم دینی و طبیعی، ریاضی، طب، نجوم و فلسفه تدریس می‌شد. میرداماد، ملاصدرا، شیخ بهایی و مجلسی. شیخ بهایی: تقسیم آب زاینده‌رود، گرمابهٔ شمعی، مسجد چهارباغ، قنات زرین‌کمر (یونسکو: سال ۲۰۰۹ «نجوم و شیخ بهایی»). ادب: سبک هندی، صائب تبریزی و بیدل.</p><p><b>هنر:</b> معماری، نقاشی، خوشنویسی (میرعماد، نستعلیق)، کتاب‌آرایی، خاتم‌کاری. <b>جشن‌ها:</b> نوروز، قربان، فطر، غدیر؛ عزاداری امام حسین (روضه‌خوانی، سینه‌زنی، تعزیه) → همدلی و همبستگی.</p>"],["✅ خلاصه","<p>☑ ۱۰ میلیون نفر، ۱۰–۱۵٪ شهرنشین ☑ ۳ منبع درآمد ☑ ابریشم، قالی، کاشان ☑ کاروانسرا و قیصریه ☑ شیخ بهایی، ملاصدرا، مجلسی ☑ صائب و بیدل ☑ میرعماد.</p>"]],
10:[["۱) افشاریه: نادر","<p>پس از افغان‌ها، ایران تجزیه شد و روسیه و عثمانی بخش‌هایی را اشغال کردند. <b>نادر</b> (ایل افشار) افغان‌ها و بیگانگان را بیرون راند، شاه شد و افشاریه را بنیان گذاشت. در تعقیب افغان‌ها تا <b>دهلی</b> لشکر کشید و با غنیمت برگشت. اهمیت خلیج فارس و نیروی دریایی را می‌دانست اما کارهایش با مرگش متوقف شد. در سال‌های پایانی بدگمان و خشن شد و فرماندهانش او را کشتند و کشور دوباره صحنهٔ جنگ محلی شد.</p>"],["۲) زندیه: کریم‌خان","<p><b>کریم‌خان زند</b> با پیروزی بر مدعیان، بجای «شاه» لقب <b>وکیل‌الرعایا</b> (نمایندهٔ مردم) گرفت؛ حدود <b>۳۰ سال</b> حکومت کرد؛ پایتخت: <b>شیراز</b> (بازار وکیل، مسجد وکیل، حمام وکیل، ارگ). آرامش نسبی و بهبود اقتصاد. هم‌زمان انگلیس بر هندوستان مسلط شد و نفوذ تجاری‌ش در ایران بیشتر شد. پس از مرگ کریم‌خان، خاندانش با هم جنگیدند.</p>"],["۳) قاجاریه و جنگ‌های روسیه","<p>آقامحمدخان لطفعلی‌خان زند را شکست و کشت، کرمانی‌ها را بی‌رحمانه مجازات کرد، <b>تهران</b> را پایتخت کرد و به دست خدمتکارانش کشته شد. برادرزاده‌اش <b>فتحعلی‌شاه</b> جانشین شد.</p>"+K("<b>انقلاب صنعتی</b> (از انگلستان): نیروی ماشین جای دست را گرفت → قدرت اقتصادی، نظامی و سیاسی اروپا بیشتر شد و به مستعمره‌ها و برده‌داری و بازارها طمع کردند. پیامد: نگاه ابزاری به انسان و تخریب محیط زیست")+TB(["عهدنامه","پیامد"],[["گلستان (پس از ده سال جنگ)","جدا شدن گرجستان، داغستان، باکو و گنجه"],["ترکمانچای (ننگین‌تر)","سرزمین‌های شمال ارس از دست رفت، غرامت، محرومیت از کشتی جنگی در دریای مازندران"]])+Tp("علت شکست: ضعف فرماندهی، ابزار ابتدایی، خیانت برخی درباریان، کنار گذاشتن قائم‌مقام، فریب روسیه و انگلیس. مردم با فتوای علما بسیج شدند و در ابتدا مناطق را آزاد کردند اما روسیه دوباره به میدان آمد.")],["۴) هدف انگلستان در ایران","<p>هندوستان، مستعمرهٔ انگلستان، همسایهٔ ایران بود؛ پس انگلیس می‌خواست نفوذ خود را در ایران و خلیج فارس بگسترد تا هند را حفظ کند.</p>"],["✅ خلاصه","<p>☑ نادر: دهلی، نیروی دریایی، قتل ☑ وکیل‌الرعایا، شیراز، ۳۰ سال ☑ آقامحمدخان، تهران، فتحعلی‌شاه ☑ انقلاب صنعتی ☑ گلستان و ترکمانچای.</p>"]],
11:[["۱) عباس‌میرزا، نخستین نوساز","<p>شکست‌های قاجار از روسیه و انگلیس ارزش علم را نمایان کرد. <b>عباس‌میرزا</b> (ولیعهد فتحعلی‌شاه) متوجه شد روس‌ها به دلیل دانش و تجهیزات پیشرفته توانسته‌اند پیروز شوند و نتیجه گرفت کثرت سپاه و دلاوری کافی نیست.</p>"+K("اقدامات: اعزام دانشجو به انگلستان (فنی، نظامی، پزشکی)، ترجمه کتاب‌های تاریخی اروپایی، ورود چاپ، نوسازی ارتش. وی پیش از رفتن به دفاع از هرات به‌طرز مشکوکی درگذشت")],["۲) امیرکبیر (میرزا تقی‌خان)","<p>متولد ۱۲۲۲ ق در فراهان (اراک)، شاگرد قائم‌مقام. ناصرالدین‌شاه او را صدراعظم کرد و اختیار کامل داد. مشکلات: شورش ایالت‌ها، دخالت خارجی، بی‌نظمی، خزانهٔ خالی.</p>"+TB(["حوزه","اصلاحات"],[["اداری و مالی","منع رشوه و پیشکش (حقوق معین)، منع فروش حکومت ایالت‌ها، کاهش مستمری شاه و درباریان، مالیات از زمین‌داران بزرگ"],["نظامی و قضایی","سپاه منظم، کارخانهٔ اسلحه‌سازی، منع شکنجه، عدالت و احترام به اقلیت‌های دینی"],["فرهنگی و عمرانی","روزنامه وقایع اتفاقیه (نخستین روزنامهٔ رسمی)، ترجمه، چاپخانه، بیمارستان، مبارزه با آبله و وبا، سنگ‌فرش خیابان‌ها، پست، گذرنامه، بازار تهران"]])+K("<b>دارالفنون</b> (۱۲۶۸ ق): بیش از صد دانشجو در مهندسی، پزشکی، شیمی، داروسازی، معدن‌شناسی و نظامی. امیرکبیر معلم روسی و انگلیسی نخواست و از جایی مثل اتریش استاد آورد. او به توطئهٔ درباریان برکنار و با فرمان ناصرالدین‌شاه کشته شد")],["۳) مدارس جدید و بیداری مردم","<p>در مکتب‌خانه الفبا، قرآن، گلستان و بوستان می‌خواندند؛ میرزا حسن رشدیه مدارس جدید با روش تعلیم عمومی (قرآن، فارسی، حساب، هندسه، تاریخ، جغرافیا) بنیان گذاشت.</p>"],["۴) نفوذ اقتصادی و نهضت تنباکو","<p>روسیه و انگلیس امتیازهای اقتصادی گرفتند و شرکت‌های اروپایی بدون گمرک واردات می‌کردند → تولیدکننده‌های ایرانی ورشکست شدند.</p>"+TB(["انگلیس","روس"],[["تلگراف، رویتر (جنگل و معدن)، کشتی‌رانی کارون، بخت‌آزمایی، بانک شاهنشاهی، انحصار تنباکو، دارسی (نفت)","شیلات شمال، بانک استقراضی، نیروی قزاق، راه انزلی–قزوین، قرارداد گمرکی"]])+K("<b>نهضت تنباکو:</b> در زمان ناصرالدین‌شاه یک انگلیسی امتیاز خرید و فروش انحصاری توتون و تنباکو گرفت. مردم، روحانیان و بازرگانان اعتراض کردند؛ آیت‌الله میرزا حسن شیرازی (سامرا) استفاده از تنباکو را حرام کرد و ناصرالدین‌شاه قرارداد را لغو کرد. نخستین حرکت مردمی ضد سلطهٔ خارجی و استبداد و تقویت اعتماد به نفس")+Tp("سیدجمال‌الدین اسدآبادی نیز با روزنامهٔ عروة‌الوثقی ملت‌های مسلمان را بیدار کرد.")],["✅ خلاصه","<p>☑ عباس‌میرزا: دانشجو، ترجمه، چاپ ☑ امیرکبیر: دارالفنون، وقایع اتفاقیه، مبارزه با فساد ☑ رشدیه ☑ امتیازها و نهضت تنباکو ☑ میرزا حسن شیرازی.</p>"]]});
